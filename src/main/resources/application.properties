# 应用服务 WEB 访问端口
server.port=8080
# 统一接口前缀，与前端 vite 代理 /api -> localhost:8080（无 rewrite）保持一致
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 数据库连接（对应 schema-mysql.sql）
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/schema-mysql?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=zxc1234567890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置（使用注解 SQL，map-underscore-to-camel-case 自动映射下划线字段）
mybatis.type-aliases-package=com.imut.diab_health_sys01.entity
mybatis.configuration.map-underscore-to-camel-case=true

# JWT 配置
jwt.secret=diab-health-sys-jwt-secret-2026
jwt.expire-hours=168

# Jackson 时间格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

logging.level.com.imut.diab_health_sys01=info
logging.file.name=./app-runtime.log
